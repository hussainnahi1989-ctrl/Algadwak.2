<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة التفعيل</title><style>body{font-family:Arial;background:linear-gradient(135deg,#dff7f4,#fff1d6,#e9e2ff);margin:0;color:#123}main{max-width:900px;margin:30px auto;background:rgba(255,255,255,.96);padding:28px;border-radius:20px;box-shadow:0 10px 35px #3452  }h1{color:#087f8c;border-bottom:4px solid #f59e0b;padding-bottom:12px}h2{color:#7c3aed}input,button{padding:12px;margin:5px;border:1px solid #ccd;border-radius:8px}button{background:#087f8c;color:white;cursor:pointer;font-weight:bold}.req{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}.muted{color:#667}.key{font-size:20px;direction:ltr;font-weight:bold;color:#087f8c}</style><main><h1>لوحة إدارة التفعيل</h1><section id="login"><p>سجّل الدخول بحساب الإدارة</p><input id="email" type="email" placeholder="البريد الإلكتروني"><div style="display:flex;align-items:center;gap:6px"><input id="pass" type="password" placeholder="كلمة المرور"><button type="button" id="showPass" style="background:#f59e0b">إظهار</button></div><button id="loginBtn">دخول</button><p id="msg"></p></section><section id="panel" hidden><button id="logout">تسجيل الخروج</button><h2>طلبات التفعيل</h2><div id="list">جاري التحميل...</div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script>
const config={apiKey:'AIzaSyCHgE3t-5o1wAkr6cYADN9FBtjXBScYucE',authDomain:'gadwal2-e13ab.firebaseapp.com',projectId:'gadwal2-e13ab',storageBucket:'gadwal2-e13ab.firebasestorage.app',messagingSenderId:'270372951569',appId:'1:270372951569:web:5c4d2a22a296bb1b7403b0'};firebase.initializeApp(config);const auth=firebase.auth(),db=firebase.firestore();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
const $=id=>document.getElementById(id);$('showPass').onclick=()=>{const p=$('pass');p.type=p.type==='password'?'text':'password';$('showPass').textContent=p.type==='password'?'إظهار':'إخفاء'};$('loginBtn').onclick=()=>auth.signInWithEmailAndPassword($('email').value.trim(),$('pass').value).catch(e=>$('msg').textContent='خطأ Firebase: '+(e.code||'unknown')+' — '+(e.message||''));$('logout').onclick=()=>auth.signOut();auth.onAuthStateChanged(u=>{if(u){$('login').hidden=true;$('panel').hidden=false;load()}else{$('login').hidden=false;$('panel').hidden=true}});
function hash32(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0}return h>>>0}function wide(s){let o='',x=s;for(let r=0;r<5;r++){x=s+'|'+r+'|'+hash32(x+r);o+=('00000000'+hash32(x).toString(16)).slice(-8)}return o.toUpperCase()}function key(dev){const alpha='23456789ABCDEFGHJKMNPQRSTUVWXYZ',h=wide('MASOUDI-SCHEDULER-2026-HN#'+dev.replace(/[^0-9A-Z]/gi,'').toUpperCase()+'#MASOUDI-SCHEDULER-2026-HN');let o='';for(let i=0;i<16;i++)o+=alpha[parseInt(h.substr(i*2,2),16)%alpha.length];return o.replace(/(.{4})/g,'$1-').slice(0,-1)}
async function autoApproveLegacy(d){const x=d.data();if(!x.legacyActivated)return;try{const k=key(x.deviceId);await db.collection('licenses').doc(x.phone.replace(/\D/g,'')).set({schoolName:x.schoolName,phone:x.phone,activeDeviceId:x.deviceId,key:k,status:'active',legacy:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await d.ref.update({status:'approved',autoApproved:true});}catch(e){console.warn('تعذر اعتماد الطلب القديم',e)}}
function load(){db.collection('activationRequests').where('status','==','pending').orderBy('createdAt','desc').onSnapshot(async s=>{await Promise.all(s.docs.filter(d=>d.data().legacyActivated).map(autoApproveLegacy));const docs=s.docs.filter(d=>!d.data().legacyActivated);$('list').innerHTML=docs.length?'': 'لا توجد طلبات جديدة';if(docs.length)$('list').innerHTML=docs.map(d=>{let x=d.data(),k=key(x.deviceId);return `<div class=req><b>نوع الطلب:</b> طلب تفعيل جديد<br><b>المدرسة:</b> ${esc(x.schoolName)}<br><b>الهاتف:</b> ${esc(x.phone)}<br><b>الجهاز:</b> <span dir=ltr>${esc(x.deviceId)}</span><p class=key>${k}</p><button onclick="approve('${d.id}','${encodeURIComponent(JSON.stringify(x))}','${k}')">موافقة وحفظ الترخيص</button><a target=_blank href="https://wa.me/964${x.phone.replace(/^0/,'')}?text=${encodeURIComponent('رمز التفعيل: '+k)}"><button>إرسال الرمز WhatsApp</button></a></div>`}).join('')},e=>$('list').textContent='تعذر قراءة الطلبات: '+e.message)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.approve=async(id,j,k)=>{let x=JSON.parse(decodeURIComponent(j));await db.collection('licenses').doc(x.phone.replace(/\D/g,'')).set({schoolName:x.schoolName,phone:x.phone,activeDeviceId:x.deviceId,key:k,status:'active',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('activationRequests').doc(id).update({status:'approved'});alert('تم حفظ الترخيص')};
</script></html>
