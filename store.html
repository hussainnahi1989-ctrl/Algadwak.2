<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تطبيقات نادرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pri:#4f46e5;--pri2:#06b6d4;--bg:#f4f6fb;--card:#fff;--txt:#111827;--mut:#6b7280;--line:#e5e7eb;--soft:#eef2ff;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--sh:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(17,24,39,.06);--r:18px}
body.dark{--bg:#0b1020;--card:#141a2e;--txt:#eef1f8;--mut:#9aa3b8;--line:#232b45;--soft:#1c2340;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;padding-bottom:80px;transition:background .25s}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{width:1em;height:1em;flex-shrink:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;white-space:nowrap}
.brand .lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 6px 16px color-mix(in srgb,var(--pri) 40%,transparent)}
.brand small{display:block;font-size:.72rem;font-weight:500;color:var(--mut);margin-top:-4px}
.tsearch{flex:1;max-width:520px;margin-inline:auto;position:relative}
.tsearch input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 44px 0 16px;outline:none;transition:.2s}
.tsearch input:focus{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 15%,transparent)}
.tsearch>svg{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:18px}
.sugg{position:absolute;top:50px;inset-inline:0;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden;display:none;z-index:50}
.sugg.on{display:block}
.sugg a{display:flex;align-items:center;gap:10px;padding:9px 12px}
.sugg a:hover,.sugg a.act{background:var(--soft)}
.sugg img{width:34px;height:34px;border-radius:9px}
.sugg small{color:var(--mut);display:block;font-size:.78rem;line-height:1.2}
.ibtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--mut);transition:.2s}
.ibtn:hover{background:var(--soft);color:var(--pri)}
@media(max-width:700px){.brand small{display:none}.tsearch{display:none}.brand{font-size:1.05rem}.top .wrap{justify-content:space-between}}

/* bottom nav */
.bnav{position:fixed;bottom:0;inset-inline:0;z-index:40;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--mut);padding:4px 10px;border-radius:14px;min-width:62px;font-weight:500}
.bnav a .ic{font-size:21px;padding:3px 16px;border-radius:999px;display:grid;place-items:center;transition:.2s}
.bnav a.on{color:var(--pri);font-weight:700}
.bnav a.on .ic{background:var(--soft)}

/* common */
.sec{margin:26px 0}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh h2{font-size:1.2rem;font-weight:800}
.sh a{color:var(--pri);font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.9rem;font-weight:500;transition:.2s}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip:hover:not(.on){border-color:var(--pri);color:var(--pri)}
.row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.row>*{scroll-snap-align:start}
.tile{width:128px;flex-shrink:0;transition:.2s}
.tile:hover{transform:translateY(-3px)}
.tile img{width:128px;height:128px;border-radius:28px;box-shadow:var(--sh);display:block;object-fit:cover;background:var(--soft)}
.tile b{display:block;font-size:.92rem;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font-size:.8rem;color:var(--mut);display:flex;gap:6px;align-items:center}
.stars{color:var(--warn);display:inline-flex;align-items:center;gap:2px;font-weight:700}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
.empty .big{font-size:52px;opacity:.5}

/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;margin-top:18px;min-height:230px;box-shadow:var(--sh)}
.slide{position:absolute;inset:0;display:flex;align-items:center;gap:22px;padding:28px 32px;color:#fff;opacity:0;transition:opacity .6s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto;position:relative}
.slide::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 120%,rgba(255,255,255,.18),transparent 55%);pointer-events:none}
.slide img{width:120px;height:120px;border-radius:30px;box-shadow:0 12px 30px rgba(0,0,0,.25);border:3px solid rgba(255,255,255,.3);flex-shrink:0;object-fit:cover}
.slide .tg{display:inline-block;background:rgba(255,255,255,.2);padding:3px 12px;border-radius:999px;font-size:.78rem;font-weight:700;margin-bottom:6px}
.slide h3{font-size:1.8rem;font-weight:800;line-height:1.25}
.slide p{opacity:.92;max-width:520px;margin:6px 0 14px}
.slide .go{background:#fff;color:#111;padding:10px 22px;border-radius:999px;font-weight:800;display:inline-flex;gap:8px;align-items:center}
.dots{position:absolute;bottom:12px;left:20px;display:flex;gap:6px;z-index:3}
.dots button{width:8px;height:8px;border-radius:9px;background:rgba(255,255,255,.5);transition:.3s}
.dots button.on{width:24px;background:#fff}
@media(max-width:600px){.slide{flex-direction:column;align-items:flex-start;gap:12px;padding:22px}.slide img{width:78px;height:78px;border-radius:20px}.slide h3{font-size:1.4rem}}

/* stats strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.strip div{background:var(--card);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--sh)}
.strip b{display:block;font-size:1.4rem;color:var(--pri);font-weight:800}
.strip span{font-size:.82rem;color:var(--mut)}

/* category grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.cat{background:var(--card);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);transition:.2s;font-weight:700}
.cat:hover{transform:translateY(-2px);color:var(--pri)}
.cat i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:20px;background:var(--soft)}
.cat small{display:block;color:var(--mut);font-weight:500;font-size:.8rem}

/* list items */
.lhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:20px 0 8px}
.lhead h1{font-size:1.5rem;font-weight:800;display:flex;align-items:center;gap:10px}
.sel{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
@media(max-width:400px){.grid{grid-template-columns:1fr}}
.item{background:var(--card);border-radius:var(--r);padding:14px;display:flex;gap:14px;align-items:center;box-shadow:var(--sh);transition:.2s;border:1px solid transparent}
.item:hover{border-color:color-mix(in srgb,var(--pri) 35%,transparent);transform:translateY(-2px)}
.item img{width:72px;height:72px;border-radius:18px;object-fit:cover;flex-shrink:0;background:var(--soft)}
.item .in{flex:1;min-width:0}
.item b{display:block;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item p{font-size:.85rem;color:var(--mut);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--mut);margin-top:3px}
.pf{display:inline-flex;align-items:center;gap:3px;background:var(--soft);color:var(--pri);padding:1px 8px;border-radius:999px;font-size:.74rem;font-weight:700}
.getbtn{background:var(--soft);color:var(--pri);font-weight:800;padding:7px 16px;border-radius:999px;font-size:.88rem;white-space:nowrap}
.mtop{margin-top:18px}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:700;margin-top:16px;padding:6px 10px 6px 4px;border-radius:10px}
.back:hover{color:var(--pri)}
.dhead{display:flex;gap:22px;align-items:flex-start;margin-top:10px}
.dhead>img{width:132px;height:132px;border-radius:30px;box-shadow:var(--sh);object-fit:cover;flex-shrink:0;background:var(--soft)}
.dhead h1{font-size:2rem;font-weight:800;line-height:1.2}
.dev{color:var(--pri);font-weight:700;margin:4px 0 8px}
.facts{display:flex;gap:0;margin:16px 0;background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow-x:auto}
.facts div{flex:1;min-width:92px;text-align:center;padding:12px 8px;border-inline-start:1px solid var(--line)}
.facts div:first-child{border:0}
.facts b{display:flex;justify-content:center;align-items:center;gap:3px;font-size:1.05rem}
.facts span{font-size:.75rem;color:var(--mut)}
.dls{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn-dl{flex:1;min-width:200px;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 70%,var(--pri2)));color:#fff;font-weight:800;font-size:1.05rem;padding:14px 22px;border-radius:16px;box-shadow:0 10px 24px color-mix(in srgb,var(--pri) 35%,transparent);transition:.2s}
.btn-dl:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn-dl.alt{background:var(--card);color:var(--pri);border:2px solid var(--pri);box-shadow:none}
.btn-dl svg{font-size:22px}
.btn-dl small{display:block;font-weight:500;font-size:.75rem;opacity:.85;line-height:1}
.sharebtn{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:700;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.sharebtn:hover{color:var(--pri);border-color:var(--pri)}
@media(max-width:600px){.dhead>img{width:92px;height:92px;border-radius:22px}.dhead h1{font-size:1.45rem}.dhead{gap:14px}}
.shots{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;align-items:center}
.shots img{height:380px;width:auto;max-width:none;border-radius:16px;box-shadow:var(--sh);cursor:zoom-in;scroll-snap-align:start;flex-shrink:0;background:var(--soft);transition:.2s;object-fit:contain}
.shots img.land{height:auto;width:min(620px,86vw)}
.shots img:hover{transform:scale(1.015)}
@media(max-width:600px){.shots img{height:320px}.shots img.land{height:auto;width:86vw}}
.card{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh)}
.card h3{font-size:1.1rem;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 svg{color:var(--pri)}
.desc{white-space:pre-line;color:var(--txt);opacity:.92}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.feat{display:flex;gap:10px;align-items:flex-start;background:var(--soft);padding:12px 14px;border-radius:14px;font-weight:500}
.feat svg{color:var(--ok);font-size:20px;margin-top:2px}
.addon{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px dashed color-mix(in srgb,var(--pri) 40%,var(--line));border-radius:16px;transition:.2s;margin-top:10px}
.addon:hover{background:var(--soft);border-style:solid}
.addon img{width:56px;height:56px;border-radius:14px;object-fit:cover}
.addon .in{flex:1;min-width:0}
.addon .bdg{background:var(--pri);color:#fff;font-size:.7rem;padding:1px 8px;border-radius:999px;font-weight:700;margin-inline-start:6px}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.info div{padding:10px 12px;border-radius:12px;background:var(--soft)}
.info span{display:block;font-size:.78rem;color:var(--mut)}
.info b{font-size:.95rem}
.two{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px;align-items:start}
.two>div{display:grid;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}}

/* lightbox */
#lb{position:fixed;inset:0;z-index:90;background:rgba(5,8,18,.92);display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:86vh;border-radius:14px}
#lb .x,#lb .nv{position:absolute;color:#fff;background:rgba(255,255,255,.12);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px}
#lb .x{top:16px;left:16px}
#lb .p{right:16px;top:50%}#lb .n{left:16px;top:50%}
#lb .cnt{position:absolute;bottom:18px;color:#fff;opacity:.8}

/* modal */
#modal{position:fixed;inset:0;z-index:80;background:rgba(5,8,18,.55);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
#modal.on{display:flex}
.mbox{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px;animation:up .25s ease}
@media(min-width:760px){#modal{align-items:center}.mbox{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;position:sticky;top:-20px;background:var(--card);padding:8px 0;z-index:2}
.mh h2{font-size:1.2rem;font-weight:800}
.fg{margin-bottom:14px}
.fg label{display:block;font-weight:700;font-size:.88rem;margin-bottom:5px}
.fg label small{color:var(--mut);font-weight:500}
.inp{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:9px 12px;outline:none}
.inp:focus{border-color:var(--pri)}
textarea.inp{min-height:90px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.f2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:12px;font-weight:700;background:var(--soft);color:var(--pri);transition:.2s}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--pri);color:#fff}
.btn.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:10px}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px;position:sticky;bottom:-20px;background:var(--card);padding:12px 0}
.pfs{display:flex;flex-wrap:wrap;gap:8px}
.pfs label{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:500}
.pfs input{accent-color:var(--pri)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}
.thumbs img{height:90px;width:auto;max-width:180px;object-fit:contain;background:var(--soft);border-radius:10px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-6px;left:-6px;width:24px;height:24px;border-radius:50%;background:var(--bad);color:#fff;font-size:13px;display:grid;place-items:center}
.iconprev{display:flex;align-items:center;gap:12px}
.iconprev img{width:72px;height:72px;border-radius:18px;border:1px solid var(--line);object-fit:cover}
.lnk{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-bottom:8px}
@media(max-width:520px){.lnk{grid-template-columns:1fr auto}.lnk .u{grid-column:1/-1;grid-row:2}}
.adlist{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px}
.adlist label{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;cursor:pointer}
.adlist label:hover{background:var(--soft)}
.adlist img{width:30px;height:30px;border-radius:8px}

/* admin */
.atabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;box-shadow:var(--sh);margin:16px 0;overflow-x:auto}
.atabs button{flex:1;padding:10px 14px;border-radius:10px;font-weight:700;color:var(--mut);white-space:nowrap}
.atabs button.on{background:var(--pri);color:#fff}
.arow{display:flex;align-items:center;gap:12px;background:var(--card);padding:10px 12px;border-radius:14px;box-shadow:var(--sh);margin-bottom:8px}
.arow img{width:48px;height:48px;border-radius:12px;object-fit:cover}
.arow .in{flex:1;min-width:0}
.arow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow small{color:var(--mut)}
.pin{max-width:340px;margin:50px auto;text-align:center}
.pin .lk{width:74px;height:74px;border-radius:22px;margin:0 auto 14px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-size:34px}
.pin input{text-align:center;font-size:1.4rem;letter-spacing:8px;margin:14px 0}
.note{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);padding:12px 14px;border-radius:14px;font-size:.9rem;margin-bottom:14px}
.note.info{background:var(--soft);border-color:color-mix(in srgb,var(--pri) 25%,transparent)}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--txt)}

#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:11px 20px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;z-index:99;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:30px 0 10px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#" id="brandLink"><span class="lg" id="brandIcon">✦</span><span><span id="brandName">تطبيقات نادرة</span><small id="brandTag"></small></span></a>
  <div class="tsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="topQ" placeholder="ابحث عن تطبيق، تصنيف، ميزة..." autocomplete="off"><div class="sugg" id="sugg"></div></div>
  <button class="ibtn" id="themeBtn" title="الوضع الليلي"></button>
  <a class="ibtn" href="#admin" title="لوحة الإدارة" id="adminBtn" style="display:none"></a>
</div></header>

<main id="view" class="wrap"></main>
<footer class="wrap" id="foot"></footer>

<nav class="bnav" id="bnav"></nav>
<div id="modal"></div>
<div id="lb"></div>

function svgUri(s){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)}
function genIcon(a){const g=a.glyph||(a.name||'؟').trim()[0];return svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a.c1||'#4f46e5'}"/><stop offset="1" stop-color="${a.c2||'#06b6d4'}"/></linearGradient></defs><rect width="256" height="256" fill="url(#g)"/><circle cx="210" cy="40" r="90" fill="#fff" opacity=".12"/><text x="128" y="150" font-size="${/\p{Extended_Pictographic}/u.test(g)?120:130}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-family="Tajawal,sans-serif" font-weight="800">${esc(g)}</text></svg>`)}
function genShot(a,i){const t=['الشاشة الرئيسية','إدخال البيانات','التقارير','الإعدادات','الطباعة'][i%5];const c1=a.c1||'#4f46e5',c2=a.c2||'#06b6d4';let rows='';for(let k=0;k<6;k++)rows+=`<rect x="24" y="${250+k*72}" width="312" height="58" rx="14" fill="#fff" opacity=".92"/><rect x="250" y="${264+k*72}" width="70" height="30" rx="10" fill="${k%2?c2:c1}" opacity=".85"/><rect x="40" y="${266+k*72}" width="${110+((k*37+i*20)%90)}" height="12" rx="6" fill="#cbd5e1"/><rect x="40" y="${286+k*72}" width="${70+((k*23)%60)}" height="9" rx="4" fill="#e2e8f0"/>`;
return svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="360" height="720" fill="#f1f5f9"/><rect width="360" height="220" fill="url(#g)"/><circle cx="300" cy="40" r="120" fill="#fff" opacity=".1"/><text x="180" y="95" text-anchor="middle" fill="#fff" font-size="30" font-weight="800" font-family="Tajawal,sans-serif">${esc(a.name)}</text><text x="180" y="140" text-anchor="middle" fill="#fff" opacity=".85" font-size="20" font-family="Tajawal,sans-serif">${t}</text>${rows}</svg>`)}

function renderHome(){
  const apps=S.apps,feat=apps.filter(a=>a.featured);const heroL=(feat.length?feat:apps).slice(0,6);

/* smart search: normalized arabic + scoring across fields */
const norm=s=>String(s||'').toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();
function smartSearch(q,list){const ws=norm(q).split(/\s+/).filter(Boolean);return list.map(a=>{let s=0;const n=norm(a.name),c=norm(a.cat),sh=norm(a.short+' '+a.desc),f=norm((a.features||[]).join(' ')),d=norm(a.dev);for(const w of ws){if(n.startsWith(w))s+=12;else if(n.includes(w))s+=8;if(c.includes(w))s+=5;if(f.includes(w))s+=3;if(sh.includes(w))s+=2;if(d.includes(w))s+=1;if((a.platforms||[]).some(p=>norm(PF[p]?.n).includes(w)||p.includes(w)))s+=4}return{a,s}}).filter(x=>x.s>0).sort((x,y)=>y.s-x.s).map(x=>x.a)}

function downloadOrCopy(text,name,type,title){let ok=false;try{const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);ok=true}catch(e){}

/* image helpers */
function readImg(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);const png=file.type==='image/png'&&max<=512;res(c.toDataURL(png?'image/png':'image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

  <div class="fg"><label>أيقونة التطبيق <small>(صورة مربعة)</small></label><div class="iconprev"><img id="icPrev" src="${icon(a)}"><label class="btn sm" style="cursor:pointer">${I.img} رفع صورة<input type="file" accept="image/*" id="icFile" hidden></label><button class="btn sm" id="icUrl">من رابط</button>${a.icon?'<button class="btn sm bad" id="icClr">إزالة</button>':''}</div></div>
  <div class="f2"><div class="fg"><label>اسم التطبيق *</label><input class="inp" id="fName" value="${esc(a.name)}"></div><div class="fg"><label>المطوّر</label><input class="inp" id="fDev" value="${esc(a.dev)}"></div></div>
  <div class="f2"><div class="fg"><label>التصنيف *</label><input class="inp" id="fCat" list="catList" value="${esc(a.cat)}" placeholder="اختر أو اكتب تصنيفاً جديداً"><datalist id="catList">${cats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div><div class="fg"><label>الإصدار</label><input class="inp" id="fVer" value="${esc(a.version)}"></div></div>
  <div class="fg"><label>المنصّات</label><div class="pfs">${Object.entries(PF).map(([k,v])=>`<label><input type="checkbox" value="${k}" ${a.platforms.includes(k)?'checked':''}>${v.i} ${v.n}</label>`).join('')}</div></div>
  <div class="fg"><label>روابط التحميل * <small>(Google Drive، MediaFire، أي رابط)</small></label><div id="lnks"></div><button class="btn sm" id="addLnk">${I.plus} رابط آخر</button></div>
  <div class="fg"><label>وصف قصير <small>(يظهر في القوائم)</small></label><input class="inp" id="fShort" value="${esc(a.short)}" maxlength="120"></div>
  <div class="fg"><label>الوصف الكامل</label><textarea class="inp" id="fDesc">${esc(a.desc)}</textarea></div>
  <div class="fg"><label>مميزات التطبيق <small>(كل ميزة في سطر)</small></label><textarea class="inp" id="fFeat">${esc((a.features||[]).join('\n'))}</textarea></div>
  <div class="fg"><label>صور توضيحية <small>(لقطات شاشة — عمودية أو أفقية)</small></label><div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn sm" style="cursor:pointer">${I.img} رفع صور<input type="file" accept="image/*" multiple id="shFile" hidden></label><button class="btn sm" id="shUrl">إضافة من رابط</button></div><div class="thumbs" id="thumbs"></div></div>
  <div class="fg"><label>ملحقات هذا التطبيق <small>(تطبيقات أخرى تعمل معه)</small></label>${others.length?`<div class="adlist">${others.map(x=>`<label><input type="checkbox" value="${x.id}" ${a.addons.includes(x.id)?'checked':''}><img src="${icon(x)}">${esc(x.name)}</label>`).join('')}</div>`:'<p style="color:var(--mut);font-size:.85rem">أضف تطبيقات أخرى أولاً لتتمكن من ربطها كملحقات.</p>'}</div>
  <div class="fg"><label>ما الجديد في هذا الإصدار</label><textarea class="inp" id="fNews" style="min-height:60px">${esc(a.news)}</textarea></div>
  <div class="f2"><div class="fg"><label>الحجم</label><input class="inp" id="fSize" value="${esc(a.size)}" placeholder="مثال: 5 MB"></div><div class="fg"><label>عدد التنزيلات</label><input class="inp" id="fDl" value="${esc(a.dl)}" placeholder="مثال: +1000"></div></div>
  <div class="f2"><div class="fg"><label>التقييم (1-5)</label><input class="inp" id="fRate" type="number" min="1" max="5" step="0.1" value="${a.rating}"></div><div class="fg"><label>تاريخ التحديث</label><input class="inp" id="fUpd" type="date" value="${esc(a.updated)}"></div></div>
  <div class="fg"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="fFeatd" ${a.featured?'checked':''} style="width:20px;height:20px;accent-color:var(--pri)"> عرضه ضمن التطبيقات المميزة في الواجهة</label></div>
  <div class="acts"><button class="btn" data-close>إلغاء</button><button class="btn pri" id="fSave">حفظ التطبيق</button></div>`);
  const drawLinks=()=>{$('#lnks').innerHTML=a.links.map((l,i)=>`<div class="lnk"><input class="inp" data-l="${i}" data-k="label" value="${esc(l.label)}" placeholder="نص الزر"><input class="inp u" data-l="${i}" data-k="url" value="${esc(l.url)}" placeholder="https://drive.google.com/..." dir="ltr"><button class="btn sm bad" data-rl="${i}">${I.x}</button></div>`).join('');
    document.querySelectorAll('#lnks input').forEach(n=>n.oninput=()=>a.links[n.dataset.l][n.dataset.k]=n.value);
    document.querySelectorAll('[data-rl]').forEach(b=>b.onclick=()=>{a.links.splice(+b.dataset.rl,1);drawLinks()})};drawLinks();
  $('#addLnk').onclick=()=>{a.links.push({label:'تحميل للحاسوب',url:''});drawLinks()};
  const drawThumbs=()=>{$('#thumbs').innerHTML=a.shots.map((s,i)=>`<div><img src="${s}"><button data-rs="${i}">${I.x}</button></div>`).join('')||'<small style="color:var(--mut)">لا توجد صور — ستظهر صور توضيحية تلقائية للتطبيقات التجريبية فقط</small>';document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{a.shots.splice(+b.dataset.rs,1);drawThumbs()})};drawThumbs();
  $('#icFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;a.icon=await readImg(f,256,.9);$('#icPrev').src=a.icon};
  $('#icUrl').onclick=()=>askUrl('رابط صورة الأيقونة',u=>{a.icon=u;$('#icPrev').src=u});
  if($('#icClr'))$('#icClr').onclick=()=>{delete a.icon;$('#icPrev').src=genIcon(a)};
  $('#shFile').onchange=async e=>{for(const f of e.target.files){try{a.shots.push(await readImg(f,1600,.82))}catch(x){}}drawThumbs();a.demo=false;toast('تمت إضافة الصور')};
  $('#shUrl').onclick=()=>{const u=prompt2('رابط الصورة');};
  function prompt2(){const box=document.createElement('div');box.className='lnk';box.style.gridTemplateColumns='1fr auto';box.innerHTML=`<input class="inp" placeholder="https://..." dir="ltr"><button class="btn sm pri">إضافة</button>`;$('#thumbs').before(box);const inp=box.querySelector('input');inp.focus();box.querySelector('button').onclick=()=>{if(inp.value.trim()){a.shots.push(inp.value.trim());drawThumbs()}box.remove()}}
  function askUrl(t,cb){const box=document.createElement('div');box.className='lnk';box.style.cssText='grid-template-columns:1fr auto;margin-top:8px';box.innerHTML=`<input class="inp" placeholder="https://... (${t})" dir="ltr"><button class="btn sm pri">تطبيق</button>`;$('.iconprev').after(box);const inp=box.querySelector('input');inp.focus();box.querySelector('button').onclick=()=>{if(inp.value.trim())cb(inp.value.trim());box.remove()}}
  $('#fName').oninput=e=>{a.name=e.target.value;if(!a.icon)$('#icPrev').src=genIcon({...a,glyph:a.glyph&&ex&&ex.name===a.name?a.glyph:null})};
  $('#fSave').onclick=()=>{
    a.name=$('#fName').value.trim();a.cat=$('#fCat').value.trim();
    if(!a.name){toast('اكتب اسم التطبيق');return}if(!a.cat){toast('اختر التصنيف');return}
    a.links=a.links.map(l=>({label:l.label.trim()||'تحميل',url:l.url.trim()})).filter(l=>l.url);
    if(!a.links.length){toast('أضف رابط تحميل واحداً على الأقل');return}
    a.links.forEach(l=>{if(!/^https?:\/\//i.test(l.url))l.url='https://'+l.url});
    a.dev=$('#fDev').value.trim();a.version=$('#fVer').value.trim();a.short=$('#fShort').value.trim();a.desc=$('#fDesc').value.trim();
    a.features=$('#fFeat').value.split('\n').map(s=>s.trim()).filter(Boolean);a.news=$('#fNews').value.trim();a.size=$('#fSize').value.trim();a.dl=$('#fDl').value.trim();
    a.rating=Math.min(5,Math.max(0,parseFloat($('#fRate').value)||0));a.updated=$('#fUpd').value;a.featured=$('#fFeatd').checked;
    a.platforms=[...document.querySelectorAll('.pfs input:checked')].map(x=>x.value);
    a.addons=[...document.querySelectorAll('.adlist input:checked')].map(x=>x.value);
    if(a.shots.length)a.demo=false;
    if(!ex||!a.glyph||ex.name!==a.name){if(!ex||ex.name!==a.name)delete a.glyph}
    if(ex){Object.keys(ex).forEach(k=>delete ex[k]);Object.assign(ex,a)}else{a.id='a'+Date.now().toString(36);S.apps.unshift(a)}
    save();closeModal();renderAdmin();toast(ex?'تم حفظ التعديلات':'تمت إضافة التطبيق');
  };
}

/* ---------- top search suggestions ---------- */
const tq=$('#topQ'),sg=$('#sugg');
tq.oninput=()=>{const q=tq.value.trim();if(!q){sg.classList.remove('on');return}const r=smartSearch(q,S.apps).slice(0,6);sg.innerHTML=r.length?r.map(a=>`<a href="#app-${a.id}"><img src="${icon(a)}"><span><b>${esc(a.name)}</b><small>${esc(a.cat)}</small></span></a>`).join('')+`<a href="#search" style="color:var(--pri);font-weight:700;justify-content:center">عرض كل النتائج</a>`:`<a style="color:var(--mut)">لا نتائج</a>`;sg.classList.add('on')};
tq.onkeydown=e=>{if(e.key==='Enter'){st.q=tq.value;location.hash='search';sg.classList.remove('on')}};
sg.onclick=e=>{if(e.target.closest('a[href="#search"]'))st.q=tq.value;sg.classList.remove('on');tq.value=''};
document.addEventListener('click',e=>{if(!e.target.closest('.tsearch'))sg.classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#lb').classList.remove('on')}});

/* ---------- router ---------- */
function route(){clearInterval(heroTimer);const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith('app-')){nav('');renderDetail(h.slice(4))}
  else if(h==='admin'&&(unlocked||authed)){nav('');renderAdmin()}
  else if(['android','windows','all','search'].includes(h)){nav(h);renderList(h);window.scrollTo({top:0})}
  else{nav('home');renderHome()}}
window.addEventListener('hashchange',route);
$('#themeBtn').onclick=()=>setTheme(!document.body.classList.contains('dark'));
$('#adminBtn').innerHTML=I.gear;
/* hidden admin: tap the logo 5 times in a row */
let unlocked=false,taps=0,tapT=null;
function showAdminBtn(){$('#adminBtn').style.display=authed?'':'none'}
$('#brandLink').addEventListener('click',e=>{e.preventDefault();taps++;clearTimeout(tapT);tapT=setTimeout(()=>{taps=0},1500);
  if(taps>=5){taps=0;unlocked=true;if(location.hash==='#admin')route();else location.hash='admin'}
  else if(taps===1&&location.hash&&location.hash!=='#'){location.hash=''}});
showAdminBtn();
let dk=false;try{dk=localStorage.getItem('st-dark')==='1'}catch(e){}
setTheme(dk);applySettings();route();
</script>
</body>
</html>
