<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تطبيقات نادرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pri:#4f46e5;--pri-t:var(--pri);--pri2:#06b6d4;--bg:#f4f6fb;--card:#fff;--txt:#111827;--mut:#6b7280;--line:#e5e7eb;--soft:#eef2ff;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--sh:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(17,24,39,.06);--r:18px}
body.dark{color-scheme:dark;--bg:#17191e;--card:#22252c;--txt:#eef0f4;--mut:#a7adba;--line:#323640;--soft:color-mix(in srgb,var(--pri) 18%,#22252c);--pri-t:color-mix(in srgb,var(--pri) 55%,#ffffff);--sh:0 1px 2px rgba(0,0,0,.2),0 4px 14px rgba(0,0,0,.22)}
body.dark .chip.on,body.dark .btn.pri,body.dark .atabs button.on{color:#fff}
body.dark .slide .go{color:#111}
body.dark #toast{background:#eef0f4;color:#17191e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
.desc,.feat span,.card p,.info b,.item p,.dhead h1,.slide h3,.slide p{overflow-wrap:anywhere}
html{scroll-behavior:smooth}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;padding-bottom:80px;transition:background .25s}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{width:1em;height:1em;flex-shrink:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;white-space:nowrap}
.brand .lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 6px 16px color-mix(in srgb,var(--pri) 40%,transparent)}
.brand small{display:block;font-size:.72rem;font-weight:500;color:var(--mut);margin-top:-4px}
.tsearch{flex:1;max-width:520px;margin-inline:auto;position:relative}
.tsearch input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 44px 0 16px;outline:none;transition:.2s}
.tsearch input:focus{border-color:var(--pri-t);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 15%,transparent)}
.tsearch>svg{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:18px}
.sugg{position:absolute;top:50px;inset-inline:0;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden;display:none;z-index:50}
.sugg.on{display:block}
.sugg a{display:flex;align-items:center;gap:10px;padding:9px 12px}
.sugg a:hover,.sugg a.act{background:var(--soft)}
.sugg img{width:34px;height:34px;border-radius:9px}
.sugg small{color:var(--mut);display:block;font-size:.78rem;line-height:1.2}
.ibtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--mut);transition:.2s}
.ibtn:hover{background:var(--soft);color:var(--pri-t)}
@media(max-width:700px){.brand small{display:none}.tsearch{display:none}.brand{font-size:1.05rem}.top .wrap{justify-content:space-between}}

/* bottom nav */
.bnav{position:fixed;bottom:0;inset-inline:0;z-index:40;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--mut);padding:4px 10px;border-radius:14px;min-width:62px;font-weight:500}
.bnav a .ic{font-size:21px;padding:3px 16px;border-radius:999px;display:grid;place-items:center;transition:.2s}
.bnav a.on{color:var(--pri-t);font-weight:700}
.bnav a.on .ic{background:var(--soft)}

/* common */
.sec{margin:26px 0}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh h2{font-size:1.2rem;font-weight:800}
.sh a{color:var(--pri-t);font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.9rem;font-weight:500;transition:.2s}
.chip.on{background:var(--pri);border-color:var(--pri-t);color:#fff}
.chip:hover:not(.on){border-color:var(--pri-t);color:var(--pri-t)}
.row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.row>*{scroll-snap-align:start}
.tile{width:128px;flex-shrink:0;transition:.2s}
.tile:hover{transform:translateY(-3px)}
.tile img{width:128px;height:128px;border-radius:28px;box-shadow:var(--sh);display:block;object-fit:cover;background:var(--soft)}
.tile b{display:block;font-size:.92rem;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font-size:.8rem;color:var(--mut);display:flex;gap:6px;align-items:center}
.stars{color:var(--warn);display:inline-flex;align-items:center;gap:2px;font-weight:700}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
.empty .big{font-size:52px;opacity:.5}

/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;margin-top:18px;min-height:230px;box-shadow:var(--sh)}
.slide{position:absolute;inset:0;display:flex;align-items:center;gap:22px;padding:28px 32px;color:#fff;opacity:0;transition:opacity .6s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto;position:relative}
.slide{min-height:230px}
.slide::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 120%,rgba(255,255,255,.18),transparent 55%);pointer-events:none}
.slide img{width:120px;height:120px;border-radius:30px;box-shadow:0 12px 30px rgba(0,0,0,.25);border:3px solid rgba(255,255,255,.3);flex-shrink:0;object-fit:cover}
.slide .tg{display:inline-block;background:rgba(255,255,255,.2);padding:3px 12px;border-radius:999px;font-size:.78rem;font-weight:700;margin-bottom:6px}
.slide h3{font-size:1.8rem;font-weight:800;line-height:1.25}
.slide p{opacity:.92;max-width:520px;margin:6px 0 14px}
.slide .go{background:#fff;color:#111;padding:10px 22px;border-radius:999px;font-weight:800;display:inline-flex;gap:8px;align-items:center}
.dots{position:absolute;bottom:12px;left:20px;display:flex;gap:6px;z-index:3}
.dots button{width:8px;height:8px;border-radius:9px;background:rgba(255,255,255,.5);transition:.3s}
.dots button.on{width:24px;background:#fff}
@media(max-width:600px){.slide{flex-direction:column;align-items:flex-start;gap:12px;padding:22px}.slide img{width:78px;height:78px;border-radius:20px}.slide h3{font-size:1.4rem}}

/* stats strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.strip div{background:var(--card);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--sh)}
.strip b{display:block;font-size:1.4rem;color:var(--pri-t);font-weight:800}
.strip span{font-size:.82rem;color:var(--mut)}

/* category grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.cat{background:var(--card);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);transition:.2s;font-weight:700}
.cat:hover{transform:translateY(-2px);color:var(--pri-t)}
.cat i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:20px;background:var(--soft)}
.cat small{display:block;color:var(--mut);font-weight:500;font-size:.8rem}

/* list items */
.lhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:20px 0 8px}
.lhead h1{font-size:1.5rem;font-weight:800;display:flex;align-items:center;gap:10px}
.sel{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
@media(max-width:400px){.grid{grid-template-columns:1fr}}
.item{background:var(--card);border-radius:var(--r);padding:14px;display:flex;gap:14px;align-items:center;box-shadow:var(--sh);transition:.2s;border:1px solid transparent}
.item:hover{border-color:color-mix(in srgb,var(--pri) 35%,transparent);transform:translateY(-2px)}
.item img{width:72px;height:72px;border-radius:18px;object-fit:cover;flex-shrink:0;background:var(--soft)}
.item .in{flex:1;min-width:0}
.item b{display:block;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item p{font-size:.85rem;color:var(--mut);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--mut);margin-top:3px}
.pf{display:inline-flex;align-items:center;gap:3px;background:var(--soft);color:var(--pri-t);padding:1px 8px;border-radius:999px;font-size:.74rem;font-weight:700}
.getbtn{background:var(--soft);color:var(--pri-t);font-weight:800;padding:7px 16px;border-radius:999px;font-size:.88rem;white-space:nowrap}
.mtop{margin-top:18px}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:700;margin-top:16px;padding:6px 10px 6px 4px;border-radius:10px}
.back:hover{color:var(--pri-t)}
.dhead{display:flex;gap:22px;align-items:flex-start;margin-top:10px}
.dhead>img{width:132px;height:132px;border-radius:30px;box-shadow:var(--sh);object-fit:cover;flex-shrink:0;background:var(--soft)}
.dhead h1{font-size:2rem;font-weight:800;line-height:1.2}
.dev{color:var(--pri-t);font-weight:700;margin:4px 0 8px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0;background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.facts div{min-width:0;text-align:center;padding:12px 8px;border-inline-start:1px solid var(--line)}
.facts div:first-child{border:0}
.facts b{display:flex;justify-content:center;align-items:center;gap:3px;font-size:1.05rem}
.facts span{font-size:.75rem;color:var(--mut)}
.dls{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn-dl{flex:1;min-width:200px;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 70%,var(--pri2)));color:#fff;font-weight:800;font-size:1.05rem;padding:14px 22px;border-radius:16px;box-shadow:0 10px 24px color-mix(in srgb,var(--pri) 35%,transparent);transition:.2s}
.btn-dl:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn-dl.alt{background:var(--card);color:var(--pri-t);border:2px solid var(--pri);box-shadow:none}
.btn-dl svg{font-size:22px}
.btn-dl small{display:block;font-weight:500;font-size:.75rem;opacity:.85;line-height:1}
.sharebtn{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:700;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.sharebtn:hover{color:var(--pri-t);border-color:var(--pri-t)}
@media(max-width:600px){.dhead>img{width:92px;height:92px;border-radius:22px}.dhead h1{font-size:1.45rem}.dhead{gap:14px}}
.shots{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;align-items:center}
.shots img{height:380px;width:auto;max-width:none;border-radius:16px;box-shadow:var(--sh);cursor:zoom-in;scroll-snap-align:start;flex-shrink:0;background:var(--soft);transition:.2s;object-fit:contain}
.shots img.land{height:auto;width:min(620px,86vw)}
.shots img:hover{transform:scale(1.015)}
@media(max-width:600px){.shots img{height:320px}.shots img.land{height:auto;width:86vw}}
.card{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh)}
.card h3{font-size:1.1rem;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 svg{color:var(--pri-t)}
.desc{white-space:pre-line;color:var(--txt);opacity:.92}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.feat{display:flex;gap:10px;align-items:flex-start;background:var(--soft);padding:12px 14px;border-radius:14px;font-weight:500}
.feat svg{color:var(--ok);font-size:20px;margin-top:2px}
.addon{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px dashed color-mix(in srgb,var(--pri) 40%,var(--line));border-radius:16px;transition:.2s;margin-top:10px}
.addon:hover{background:var(--soft);border-style:solid}
.addon img{width:56px;height:56px;border-radius:14px;object-fit:cover}
.addon .in{flex:1;min-width:0}
.addon .bdg{background:var(--pri);color:#fff;font-size:.7rem;padding:1px 8px;border-radius:999px;font-weight:700;margin-inline-start:6px}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.info div{padding:10px 12px;border-radius:12px;background:var(--soft)}
.info span{display:block;font-size:.78rem;color:var(--mut)}
.info b{font-size:.95rem}
.two{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px;align-items:start}
.two>div{display:grid;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}}

/* lightbox */
#lb{position:fixed;inset:0;z-index:90;background:rgba(5,8,18,.92);display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:86vh;border-radius:14px}
#lb .x,#lb .nv{position:absolute;color:#fff;background:rgba(255,255,255,.12);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px}
#lb .x{top:16px;left:16px}
#lb .p{right:16px;top:50%}#lb .n{left:16px;top:50%}
#lb .cnt{position:absolute;bottom:18px;color:#fff;opacity:.8}

/* modal */
#modal{position:fixed;inset:0;z-index:80;background:rgba(5,8,18,.55);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
#modal.on{display:flex}
.mbox{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px;animation:up .25s ease}
@media(min-width:760px){#modal{align-items:center}.mbox{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;position:sticky;top:-20px;background:var(--card);padding:8px 0;z-index:2}
.mh h2{font-size:1.2rem;font-weight:800}
.fg{margin-bottom:14px}
.fg label{display:block;font-weight:700;font-size:.88rem;margin-bottom:5px}
.fg label small{color:var(--mut);font-weight:500}
.inp{width:100%;min-height:44px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:9px 12px;outline:none}
.inp:focus{border-color:var(--pri-t)}
textarea.inp{min-height:90px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.f2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:12px;font-weight:700;background:var(--soft);color:var(--pri-t);transition:.2s}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--pri);color:#fff}
.btn.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:10px}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px;position:sticky;bottom:-20px;background:var(--card);padding:12px 0}
.pfs{display:flex;flex-wrap:wrap;gap:8px}
.pfs label{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:500}
.pfs input{accent-color:var(--pri-t)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}
.thumbs img{height:90px;width:auto;max-width:180px;object-fit:contain;background:var(--soft);border-radius:10px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-6px;left:-6px;width:24px;height:24px;border-radius:50%;background:var(--bad);color:#fff;font-size:13px;display:grid;place-items:center}
.iconprev{display:flex;align-items:center;gap:12px}
.iconprev img{width:72px;height:72px;border-radius:18px;border:1px solid var(--line);object-fit:cover}
.lnk{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-bottom:8px}
@media(max-width:520px){.lnk{grid-template-columns:1fr auto}.lnk .u{grid-column:1/-1;grid-row:2}}
.adlist{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px}
.adlist label{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;cursor:pointer}
.adlist label:hover{background:var(--soft)}
.adlist img{width:30px;height:30px;border-radius:8px}

/* admin */
.atabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;box-shadow:var(--sh);margin:16px 0;overflow-x:auto}
.atabs button{flex:1;padding:10px 14px;border-radius:10px;font-weight:700;color:var(--mut);white-space:nowrap}
.atabs button.on{background:var(--pri);color:#fff}
.arow{display:flex;align-items:center;gap:12px;background:var(--card);padding:10px 12px;border-radius:14px;box-shadow:var(--sh);margin-bottom:8px}
.arow img{width:48px;height:48px;border-radius:12px;object-fit:cover}
.arow .in{flex:1;min-width:0}
.arow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow small{color:var(--mut)}
.pin{max-width:340px;margin:50px auto;text-align:center}
.pin .lk{width:74px;height:74px;border-radius:22px;margin:0 auto 14px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-size:34px}
.pin input{text-align:center;font-size:1.4rem;letter-spacing:8px;margin:14px 0}
.note{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);padding:12px 14px;border-radius:14px;font-size:.9rem;margin-bottom:14px}
.note.info{background:var(--soft);border-color:color-mix(in srgb,var(--pri) 25%,transparent)}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--txt)}

@media(max-width:380px){.facts{grid-template-columns:repeat(2,1fr)}.facts div:nth-child(3){border-inline-start:0}.facts div:nth-child(n+3){border-top:1px solid var(--line)}.strip b{font-size:1.2rem}.btn-dl{min-width:100%}.slide h3{font-size:1.25rem}.lhead h1{font-size:1.25rem}}
.dnav{display:none;gap:4px}
.dnav a{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-weight:700;color:var(--mut);white-space:nowrap;transition:.2s}
.dnav a:hover{color:var(--pri-t)}
.dnav a.on{background:var(--soft);color:var(--pri-t)}
@media(min-width:1024px){.bnav{display:none}body{padding-bottom:0}.dnav{display:flex}.tsearch{max-width:380px}#toast{bottom:28px}.tile{width:150px}.tile img{width:150px;height:150px;border-radius:32px}.hero{min-height:260px}.slide{min-height:260px;padding:34px 44px}}
@media(min-width:1500px){.wrap{max-width:1360px}}
@media(min-width:701px) and (max-width:1023px){.grid{grid-template-columns:repeat(2,1fr)}}

/* ===== home v2 ===== */
.home-top{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:18px}
.grid>*,.two>div>*,.home-top>*{min-width:0}
.sh>*{min-width:0}.sh h2{overflow:hidden}
.home-top .hero{margin-top:0}
@media(min-width:1024px){.home-top{grid-template-columns:minmax(0,2fr) minmax(300px,1fr);align-items:stretch}.home-top .hero{display:flex}.home-top .slide.on{flex:1 1 auto}}
.slide .mock{display:none}
@media(min-width:900px){.slide .mock{display:block;position:absolute;left:46px;top:34px;width:180px;height:auto;border-radius:26px;border:6px solid rgba(255,255,255,.28);box-shadow:0 24px 50px rgba(0,0,0,.3);transform:rotate(-7deg);object-fit:cover;background:#fff}.slide.hm>div{padding-left:230px}}
.charts{display:flex;flex-direction:column}
.charts h3{display:flex;align-items:center;justify-content:space-between;font-size:1.05rem;font-weight:800;margin-bottom:6px}
.charts h3 a{font-size:.85rem;color:var(--pri-t);font-weight:700}
.rank{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:14px;transition:.2s;min-width:0}
.rank:hover{background:var(--soft)}
.rank .n{width:22px;text-align:center;font-weight:800;color:var(--mut);flex-shrink:0}
.rank img{width:50px;height:50px;border-radius:14px;object-fit:cover;flex-shrink:0;background:var(--soft)}
.rank .in{flex:1;min-width:0}
.rank b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank small{color:var(--mut);font-size:.8rem;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
.quick a{display:flex;align-items:center;gap:10px;background:var(--card);padding:12px;border-radius:16px;box-shadow:var(--sh);transition:.2s;min-width:0}
.quick a:hover{transform:translateY(-2px)}
.quick i{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;color:#fff;flex-shrink:0;font-style:normal}
.quick b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick small{color:var(--mut);font-size:.78rem}
.quick span{min-width:0}
@media(max-width:560px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.quick a{padding:10px}.quick i{width:36px;height:36px;font-size:17px;border-radius:11px}}
.sh .arr{display:none;gap:6px}
.sh .arr button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--txt)}
.sh .arr button:hover{border-color:var(--pri);color:var(--pri-t)}
.sh .rt{display:flex;align-items:center;gap:12px;flex-shrink:0}
.sh a{white-space:nowrap}
@media(max-width:560px){.sh h2{font-size:1.02rem}.sh h2 i{width:28px;height:28px;font-size:14px}}
@media(min-width:1024px){.sh .arr{display:flex}.row{scrollbar-width:none}.row::-webkit-scrollbar{display:none}}
.sh h2{display:flex;align-items:center;gap:8px;min-width:0}
.sh h2 i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:16px;color:#fff;flex-shrink:0}
.cgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.cat2{position:relative;overflow:hidden;border-radius:18px;padding:54px 16px 16px;color:#fff;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;text-align:right;box-shadow:var(--sh);transition:.2s}
.cat2:hover{transform:translateY(-3px)}
.cat2 b{font-size:1.02rem;position:relative;z-index:1;overflow-wrap:anywhere}
.cat2 small{opacity:.9;position:relative;z-index:1}
.cat2 .ims{position:absolute;top:10px;left:10px;display:flex}
.cat2 .ims img{width:34px;height:34px;border-radius:10px;border:2px solid rgba(255,255,255,.5);margin-left:-10px;background:#fff;object-fit:cover}
@media(max-width:400px){.cgrid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.supban{margin:28px 0 10px;border-radius:22px;padding:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 14%,var(--card)),var(--card));border:1px solid var(--line)}
.supban .tx{flex:1;min-width:220px}
.supban h3{font-size:1.2rem;font-weight:800}
.supban p{color:var(--mut)}
.supbtns{display:flex;gap:10px;flex-wrap:wrap}
.sbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 20px;border-radius:14px;font-weight:800;color:#fff;transition:.2s;min-width:150px}
.sbtn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.sbtn svg{font-size:22px}
.sbtn span{text-align:right;line-height:1.35}
.sbtn small{display:block;font-weight:500;font-size:.75rem;opacity:.9}
@media(max-width:560px){.supban .supbtns,.supban .sbtn{width:100%}}
.sbtn.wa{background:#25D366;box-shadow:0 8px 20px rgba(37,211,102,.3)}
.sbtn.tg{background:#229ED9;box-shadow:0 8px 20px rgba(34,158,217,.3)}
.supp{max-width:640px;margin:30px auto;text-align:center}
.supp .ic{width:92px;height:92px;border-radius:28px;margin:0 auto 16px;display:grid;place-items:center;font-size:44px;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 14px 30px color-mix(in srgb,var(--pri) 35%,transparent)}
.supp h1{font-size:1.7rem;font-weight:800}
.supp>p{color:var(--mut);margin:6px 0 22px}
.supp .supbtns{flex-direction:column}
.supp .sbtn{width:100%;padding:16px;font-size:1.08rem;border-radius:18px}
.supp .sbtn small{display:block;font-weight:500;font-size:.78rem;opacity:.9}
.supp .tips{text-align:right;margin-top:22px}
.supp .tips li{margin:6px 22px 0 0;color:var(--mut)}
.msearch{display:none}
@media(max-width:700px){.msearch{display:grid}}
/* video */
.vthumb{position:relative;flex-shrink:0;width:min(620px,86vw);aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000 center/cover no-repeat;box-shadow:var(--sh);cursor:pointer;scroll-snap-align:start}
.vthumb .pl{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent 40%,rgba(0,0,0,.55))}
.vthumb .pl span{width:72px;height:72px;border-radius:50%;background:rgba(255,0,0,.92);display:grid;place-items:center;color:#fff;font-size:30px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:.2s}
.vthumb:hover .pl span{transform:scale(1.08)}
.vthumb .vt{position:absolute;bottom:10px;right:14px;color:#fff;font-weight:700;font-size:.9rem}
.vthumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vthumb.tt{width:min(340px,78vw);aspect-ratio:auto;height:min(605px,139vw);background:linear-gradient(160deg,#111 0%,#1f1f2e 55%,#25F4EE33 80%,#FE2C5533 100%)}
.ttbg{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;color:#fff;opacity:.12}
.vthumb.tt .pl span{background:#FE2C55}
.vbadge{display:inline-flex;align-items:center;gap:4px;background:#ff0000;color:#fff;padding:1px 9px;border-radius:999px;font-size:.74rem;font-weight:700}
#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:11px 20px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;z-index:99;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:30px 0 10px}
</style>

AB0RQAAASQAKhGNGgAo0cuCAABioeAANHALIAHR3AQAAmABU8Z8wAIxGJnJ0xlIAEQiEawAAOHAAAAAAAAAAANYH/2Q==","demo":false,"video":""},{"id":"amwme8vfc","name":"الجدول الذكي لتوزيع الدروس","dev":"حسين ناهي المسعودي","cat":"هواتف الاندرويد","platforms":["android","windows","web"],"short":"الجدول الذكي لتوزيع الدروس الاسبوعي بدون تضارب او تعارض ويدعم تفريغ الاستاذ حسب اليوم او الدرس","desc":"📚 تطبيق توزيع جدول الحصص وتواقيت الدروس\n\nالحل الذكي والمتكامل لإعداد الجداول المدرسية باحترافية وفي ثوانٍ فقط.\n\n✨ مميزات التطبيق\n\n✅ توزيع جدول الحصص آليًا بسرعة ودقة مع مراعاة جميع القيود لتوفير الوقت والجهد.\n\n✅ استثناء المعلمين والمدرسين المفرغين في أيام محددة (مثل العقود أو غيرهم) أثناء التوزيع التلقائي.\n\n✅ تنظيم جداول المراقبين مع إمكانية طباعتها مباشرة.\n\n✅ طباعة جدول كل معلم بشكل مستقل وجاهز للطباعة.\n\n✅ تصميم جداول أوقات الحصص للدوام الصباحي والمسائي مع إمكانية طباعتها.\n\n✅ تنبيهات تلقائية بموعد بدء وانتهاء كل حصة.\n\n✅ عرض الدرس الحالي مع إظهار المعلمين الشاغرين في الوقت نفسه.\n\n✅ تخصيص بيانات المدرسة بإضافة اسم المدرسة، الشعار، واسم المدير.\n\n✅ طباعة جميع جداول الشعب بمقاس A3 وA4 أفقيًا أو عموديًا بجودة عالية.\n\n✅ تعديل الجدول بسهولة بعد إنشائه، مثل تقديم أو تأخير الحصص، أو تبديل المعلمين والمواد دون الحاجة لإعادة التوزيع.\n\n✅ العديد من المزايا الاحترافية الأخرى التي ستكتشفها أثناء استخدام التطبيق.","features":["تطبيق يعمل على هواتف الاندرويد","تطبيق ذكي لتوزيع الدروس الاسبوع بدون تضارب","يمكنك طباعه جدول الاستاذ وجدول اليوم وجدول الاسبوع كله","ويمكنك طباعه جدول الذي يرسل الى التربيه","يوجد فيه ايضا تسجيل حضور الملاك","وفيه ميزه ربط الاجهزه مثل الجهاز الملحق","يقوم الاساتذه بربط التطبيق مع التطبيق الرئيسي حتى يظهر عندهم تنبيه بزمن بدء وانتهاء الحصه الخاصه به تنبيه صوتي ويعرف مهامه وجدول سد الشاغر والمراقبه ويمكن المدير ان يرى من في الدرس ومن الذي لم يدخل الدرس ويرى الحصه الجاريه اللحظيه وفيه مميزات كثيره تطبيق الملحق"],"news":"","version":"23.1","size":"","rating":5,"dl":"250","updated":"2026-11-18","featured":true,"addons":[],"links":[{"label":"تحميل للأندرويد","url":"h function svgUri(s){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)}

function genShot(a,i){const t=['الشاشة الرئيسية','إدخال البيانات','التقارير','الإعدادات','الطباعة'][i%5];const c1=a.c1||'#4f46e5',c2=a.c2||'#06b6d4';let rows='';for(let k=0;k<6;k++)rows+=`<rect x="24" y="${250+k*72}" width="312" height="58" rx="14" fill="#fff" opacity=".92"/><rect x="250" y="${264+k*72}" width="70" height="30" rx="10" fill="${k%2?c2:c1}" opacity=".85"/><rect x="40" y="${266+k*72}" width="${110+((k*37+i*20)%90)}" height="12" rx="6" fill="#cbd5e1"/><rect x="40" y="${286+k*72}" width="${70+((k*23)%60)}" height="9" rx="4" fill="#e2e8f0"/>`;
return svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="360" height="720" fill="#f1f5f9"/><rect width="360" height="220" fill="url(#g)"/><circle cx="300" cy="40" r="120" fill="#fff" opacity=".1"/><text x="180" y="95" text-anchor="middle" fill="#fff" font-size="30" font-weight="800" font-family="Tajawal,sans-serif">${esc(a.name)}</text><text x="180" y="140" text-anchor="middle" fill="#fff" opacity=".85" font-size="20" font-family="Tajawal,sans-serif">${t}</text>${rows}</svg>`)}

/* smart search: normalized arabic + scoring across fields */
const norm=s=>String(s||'').toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();
function smartSearch(q,list){const ws=norm(q).split(/\s+/).filter(Boolean);return list.map(a=>{let s=0;const n=norm(a.name),c=norm(a.cat),sh=norm(a.short+' '+a.desc),f=norm((a.features||[]).join(' ')),d=norm(a.dev);for(const w of ws){if(n.startsWith(w))s+=12;else if(n.includes(w))s+=8;if(c.includes(w))s+=5;if(f.includes(w))s+=3;if(sh.includes(w))s+=2;if(d.includes(w))s+=1;if((a.platforms||[]).some(p=>norm(PF[p]?.n).includes(w)||p.includes(w)))s+=4}return{a,s}}).filter(x=>x.s>0).sort((x,y)=>y.s-x.s).map(x=>x.a)}

  h+=`<div class="two"><div>
    <div class="card"><h3>${I.info} حول التطبيق</h3><p style="font-weight:700;margin-bottom:6px">${esc(a.short)}</p><p class="desc">${esc(a.desc)}</p></div>
    ${(a.features||[]).length?`<div class="card"><h3>${I.spark} مميزات التطبيق</h3><div class="feats">${a.features.map(f=>`<div class="feat">${I.check}<span>${esc(f)}</span></div>`).join('')}</div></div>`:''}

function hostOf(u){try{const h=new URL(u).hostname.replace('www.','');return h.includes('drive.google')?'Google Drive':h.includes('mediafire')?'MediaFire':h.includes('github')?'GitHub':h.includes('mega')?'MEGA':h.includes('dropbox')?'Dropbox':h.includes('telegram')||h.includes('t.me')?'Telegram':h}catch(e){return''}}
function copyText(t,msg){const done=()=>toast(msg||'تم النسخ');try{navigator.clipboard.writeText(t).then(done,()=>showCopy(t))}catch(e){showCopy(t)}}
function showCopy(t,title){openModal(`<div class="mh"><h2>${title||'انسخ النص'}</h2><button class="ibtn" data-close>${I.x}</button></div><textarea class="inp" style="min-height:${t.length>300?'300px':'80px'};direction:ltr;font-family:monospace;font-size:.8rem" readonly onclick="this.select()">${esc(t)}</textarea><div class="acts"><button class="btn pri" id="cpy">نسخ</button></div>`);$('#cpy').onclick=()=>{const ta=$('#modal textarea');ta.select();try{navigator.clipboard.writeText(t).then(()=>toast('تم النسخ'),()=>{document.execCommand('copy');toast('تم النسخ')})}catch(e){document.execCommand('copy');toast('تم النسخ')}}}

/* lightbox */
function openLb(i){lbIdx=i;const lb=$('#lb');lb.innerHTML=`<button class="x">${I.x}</button><button class="nv p">${I.back}</button><img><button class="nv n">${I.left}</button><div class="cnt"></div>`;lb.classList.add('on');const up=()=>{lb.querySelector('img').src=lbList[lbIdx];lb.querySelector('.cnt').textContent=`${lbIdx+1} / ${lbList.length}`};up();
lb.querySelector('.x').onclick=()=>lb.classList.remove('on');lb.querySelector('.p').onclick=e=>{e.stopPropagation();lbIdx=(lbIdx-1+lbList.length)%lbList.length;up()};lb.querySelector('.n').onclick=e=>{e.stopPropagation();lbIdx=(lbIdx+1)%lbList.length;up()};lb.onclick=e=>{if(e.target===lb)lb.classList.remove('on')};
let sx=0;lb.ontouchstart=e=>sx=e.touches[0].clientX;lb.ontouchend=e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50){lbIdx=(lbIdx+(d>0?1:-1)+lbList.length)%lbList.length;up()}}}

/* modal */
function openModal(html){const m=$('#modal');m.innerHTML=`<div class="mbox">${html}</div>`;m.classList.add('on');m.onclick=e=>{if(e.target===m||e.target.closest('[data-close]'))closeModal()}}
function closeModal(){$('#modal').classList.remove('on')}
function confirmBox(msg,ok){openModal(`<div class="mh"><h2>تأكيد</h2></div><p>${msg}</p><div class="acts"><button class="btn" data-close>إلغاء</button><button class="btn bad" id="okB">تأكيد</button></div>`);$('#okB').onclick=()=>{closeModal();ok()}}

/* ---------- GitHub publish ---------- */
const GH_DEF={owner:'hussainnahi1989-ctrl',repo:'Algadwak.2',path:'store.html',branch:'main',token:''};
function getGh(){try{return {...GH_DEF,...JSON.parse(localStorage.getItem('st-gh')||'{}')}}catch(e){return {...GH_DEF}}}
function setGh(g){try{localStorage.setItem('st-gh',JSON.stringify(g))}catch(e){}}
function pubAt(){let v=0;try{v=+localStorage.getItem('st-pubAt')||0}catch(e){}return Math.max(v,BASE_UP)}
function unpublished(){return (S.updated||0)>pubAt()}
function b64utf8(str){const by=new TextEncoder().encode(str);let bin='';for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin)}
let publishing=false,pendingPub=false,autoT=null,lastSha=null;
function autoPublish(){if(!authed)return;if(!getGh().token){return}clearTimeout(autoT);autoT=setTimeout(()=>{autoT=null;ghPublish(true)},1200)}
const isData=u=>typeof u==='string'&&u.startsWith('data:');
function fnv(str){let h=0x811c9dc5;const st=Math.max(1,Math.floor(str.length/6000));for(let i=0;i<str.length;i+=st){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)+str.length.toString(36)}
const IMG_DIR='store-img/';
async function ghPublish(auto,attempt){
  if(publishing&&!attempt){pendingPub=true;return}const g=getGh();
  const stat=m=>{const el=$('#gStat');if(el)el.innerHTML=m;toast(m.replace(/<[^>]+>/g,''))};
  if(!g.owner||!g.repo||!g.path){stat('أكمل اسم الحساب والمستودع والملف');return}
  if(!g.token){stat('أدخل رمز GitHub أولاً');return}
  publishing=true;
  const base=`https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}`;
  const H={Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json'};
  const why=st=>st===401?'الرمز (Token) غير صحيح أو منتهي الصلاحية':st===403?'الرمز لا يملك صلاحية الكتابة (Contents: Read and write)':st===404?'لم يُعثر على المستودع أو الفرع — تأكد من الأسماء ومن أن الرمز يشمل هذا المستودع':st===409||st===422?'تعارض، حاول مرة أخرى':'خطأ رقم '+st;
  const gh=async(path,opt={})=>{const r=await fetch(base+path,{method:opt.method||'GET',headers:opt.body?{...H,'Content-Type':'application/json'}:H,body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'});if(!r.ok){const e=new Error(why(r.status));e.status=r.status;throw e}return r.json()};
  const dir=g.path.includes('/')?g.path.slice(0,g.path.lastIndexOf('/')+1):'';
  try{
    const stamp=S.updated;
    stat('⏳ تجهيز الصور...');
    /* 1) icons stay inside the page but get small */
    const iconMap=new Map();
    for(const a of S.apps)if(isData(a.icon)&&a.icon.length>30000&&!iconMap.has(a.icon)){try{iconMap.set(a.icon,await shrink(a.icon,192,.85,true))}catch(e){}}
    /* 2) screenshots become separate files, loaded only on the app page */
    const shotMap=new Map();
    for(const a of S.apps)for(const u of (a.shots||[]))if(isData(u)&&!shotMap.has(u)){let d=u;if(u.length>270000){try{d=await shrink(u,1280,.8)}catch(e){}}const m=d.match(/^data:image\/([\w+.-]+);base64,(.*)$/);if(!m)continue;const ext=m[1]==='jpeg'?'jpg':m[1].replace(/\W/g,'');shotMap.set(u,{name:IMG_DIR+String(a.id).replace(/[^\w-]/g,'')+'-'+fnv(u)+'.'+ext,b64:m[2]})}
    const mapApps=apps=>apps.map(a=>({...a,icon:iconMap.get(a.icon)||a.icon,shots:(a.shots||[]).map(u=>shotMap.has(u)?shotMap.get(u).name:u)}));
    const D={...S,apps:mapApps(S.apps)};
    stat('⏳ جارٍ الاتصال بـ GitHub...');
    const ref=await gh(`/git/ref/heads/${encodeURIComponent(g.branch)}`);
    const head=ref.object.sha;const cm=await gh(`/git/commits/${head}`);
    const tree=[];let i=0;
    for(const v of shotMap.values()){i++;stat(`⏳ رفع الصور ${i} من ${shotMap.size}...`);const b=await gh('/git/blobs',{method:'POST',body:{content:v.b64,encoding:'base64'}});tree.push({path:dir+v.name,mode:'100644',type:'blob',sha:b.sha})}
    /* 3) remove image files no longer used (only inside store-img/) */
    const used=new Set();D.apps.forEach(a=>(a.shots||[]).forEach(u=>{if(String(u).startsWith(IMG_DIR))used.add(dir+u)}));
    try{const t=await gh(`/git/trees/${cm.tree.sha}?recursive=1`);(t.tree||[]).forEach(e=>{if(e.type==='blob'&&e.path.startsWith(dir+IMG_DIR)&&!used.has(e.path))tree.push({path:e.path,mode:'100644',type:'blob',sha:null})})}catch(e){}
    stat('⏳ جارٍ رفع التعديلات إلى الموقع...');
    const pg=await gh('/git/blobs',{method:'POST',body:{content:b64utf8(buildExport(D)),encoding:'base64'}});
    tree.push({path:g.path,mode:'100644',type:'blob',sha:pg.sha});
    const nt=await gh('/git/trees',{method:'POST',body:{base_tree:cm.tree.sha,tree}});
    const nc=await gh('/git/commits',{method:'POST',body:{message:'تحديث المتجر — '+new Date().toLocaleString('ar-IQ'),tree:nt.sha,parents:[head]}});
    try{await gh(`/git/refs/heads/${encodeURIComponent(g.branch)}`,{method:'PATCH',body:{sha:nc.sha}})}
    catch(e){if((e.status===422||e.status===409)&&!attempt){await new Promise(r=>setTimeout(r,1500));return ghPublish(auto,1)}throw e}
    /* success: keep the lighter data locally too */
    S.apps.forEach(a=>{if(iconMap.has(a.icon))a.icon=iconMap.get(a.icon);if(a.shots)a.shots=a.shots.map(u=>shotMap.has(u)?shotMap.get(u).name:u)});
    try{localStorage.setItem(LS,JSON.stringify(S));localStorage.setItem('st-pubAt',String(stamp))}catch(e){}
    publishing=false;stat('✅ تم النشر على الموقع — يظهر للزبائن خلال دقيقة أو دقيقتين');
    if(pendingPub){pendingPub=false;ghPublish(true);return}
    const bn=$('#pubBanner');if(bn)bn.remove();
  }catch(e){publishing=false;pendingPub=false;stat('❌ لم يُنشر: '+(e.message&&!/fetch/i.test(e.message)?e.message:'تحقق من اتصال الإنترنت')+' — ستبقى التعديلات محفوظة وتُنشر عند الضغط على «نشر الآن»');if(location.hash==='#admin'&&!$('#pubBanner'))renderAdmin()}
}

function buildExport(src){const clone=document.documentElement.cloneNode(true);clone.querySelector('#view').innerHTML='';clone.querySelector('#bnav').innerHTML='';clone.querySelector('#dnav').innerHTML='';['#modal','#lb','#toast'].forEach(s=>{const n=clone.querySelector(s);n.innerHTML='';n.className=''});clone.querySelector('body').classList.remove('dark');const sd=clone.querySelector('#store-data');const data={...(src||S),updated:Date.now()};sd.textContent=JSON.stringify(data).replace(/<\//g,'<\\/');return '<!DOCTYPE html>\n'+clone.outerHTML}
function downloadOrCopy(text,name,type,title){let ok=false;try{const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);ok=true}catch(e){}

/* image helpers */
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
/* shrink an image to max px, prefer WebP (small), fallback PNG (alpha) or JPEG */
async function shrink(dataUrl,max,q,alpha){const im=await loadImg(dataUrl);let w=im.naturalWidth,h=im.naturalHeight;const sc=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);let u=c.toDataURL('image/webp',q);if(!u.startsWith('data:image/webp'))u=alpha?c.toDataURL('image/png'):c.toDataURL('image/jpeg',q);return (sc<1||u.length<dataUrl.length)?u:dataUrl}
function readImg(file,max,q,alpha){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>shrink(r.result,max,q,alpha).then(res,rej);r.onerror=rej;r.readAsDataURL(file)})}

  if(h.startsWith('app-')){nav('');renderDetail(h.slice(4))}
  else if(h==='admin'&&(unlocked||authed)){nav('');renderAdmin()}
  else if(h==='support'){nav('support');renderSupport();window.scrollTo({top:0})}
  else if(['android','windows','all','search'].includes(h)){nav(h==='search'?'':h);renderList(h);window.scrollTo({top:0})}
  else{nav('home');renderHome()}}
window.addEventListener('hashchange',route);
$('#themeBtn').onclick=()=>setTheme(!document.body.classList.contains('dark'));
$('#adminBtn').innerHTML=I.gear;$('#mSearch').innerHTML=I.search;
/* hidden admin: tap the logo 5 times in a row */
let unlocked=false,taps=0,tapT=null;
function showAdminBtn(){$('#adminBtn').style.display=authed?'':'none'}
$('#brandLink').addEventListener('click',e=>{e.preventDefault();taps++;clearTimeout(tapT);tapT=setTimeout(()=>{taps=0},1500);
  if(taps>=5){taps=0;unlocked=true;if(location.hash==='#admin')route();else location.hash='admin'}
  else if(taps===1&&location.hash&&location.hash!=='#'){location.hash=''}});
showAdminBtn();
let dk=false;try{dk=localStorage.getItem('st-dark')==='1'}catch(e){}
setTheme(dk);applySettings();route();
</script>
</body>
</html>
